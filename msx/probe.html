<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MSX Probe</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b3d0b; color: #fff;
    font-family: Arial, Helvetica, sans-serif; }
  .wrap { height: 100%; display: -webkit-box; -webkit-box-pack: center;
    -webkit-box-align: center; display: flex; align-items: center;
    justify-content: center; text-align: center; }
  h1 { font-size: 9vw; margin: 0 0 2vh; }
  p  { font-size: 3.2vw; margin: 0; opacity: .85; line-height: 1.4; }
  small { display: block; margin-top: 4vh; font-size: 2vw; opacity: .5; }
</style>
</head>
<body>
  <!-- No script, no redirect. This exact file is reachable from both
       github.io (Fastly) and Cloudflare CDNs. Which tile opened it tells
       us which edge the TV's MSX webview can reach. -->
  <div class="wrap">
    <div>
      <h1>PROBE OK</h1>
      <p>MSX opened this page in its webview.<br>
         Note which tile you pressed &mdash; github.io or Cloudflare.</p>
      <small>msx/probe.html</small>
    </div>
  </div>
</body>
</html>
