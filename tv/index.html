<!DOCTYPE html>
<html lang="en">

<head>
    <title>Smart Twitch TV</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Unofficial Twitch client for TV (self-rendered app)" />
    <link rel="stylesheet" href="tv.css?v=1.7.2" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
    <script src="../js/twitch.js?v=1.7.2"></script>
    <script src="../js/auth.js?v=1.7.2"></script>
    <script src="../js/chat.js?v=1.7.2"></script>
    <script src="nav.js?v=1.7.2"></script>
    <script src="tv.js?v=1.7.2"></script>
</head>

<body>
    <div id="app">
        <nav id="menu" class="menu"></nav>
        <main id="content" class="content"></main>
    </div>

    <!-- Fullscreen player layer (hidden until a stream plays) -->
    <div id="player-layer" class="player-layer" style="display:none;">
        <video id="player" playsinline="playsinline" webkit-playsinline="webkit-playsinline"></video>
        <div id="osd" class="osd" style="display:none;"></div>
    </div>

    <div id="loading" class="loading" style="display:none;"><div class="spinner"></div></div>
    <div id="toast" class="toast"></div>
</body>

</html>
