<!DOCTYPE html>
<html lang="en">

<head>
    <title>Smart Twitch TV — HLS Player Plugin</title>
    <meta charset="UTF-8" />
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        video { width: 100%; height: 100%; background: #000; }

        .stv-chat {
            position: absolute;
            bottom: 2vh;
            z-index: 10;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            overflow: hidden;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 0.6vh;
        }
        .stv-head {
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
            text-align: center;
            padding: 0.3em 0.45em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.28);
            font-family: "Roboto", "LG Display", "SamsungOne", sans-serif;
        }
        .stv-head-pill {
            display: inline-block;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }
        .stv-eye {
            width: 1.05em;
            height: 1.05em;
            margin-right: 0.35em;
            vertical-align: -0.17em;
            fill: currentColor;
            opacity: 0.85;
        }
        .stv-msgs {
            -webkit-flex: 1;
            flex: 1;
            min-height: 0;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-justify-content: flex-end;
            justify-content: flex-end;
            overflow: hidden;
        }
        .stv-chat.pos-l { left: 1.5vw; }
        .stv-chat.pos-r { right: 1.5vw; }
        .stv-chat.full { height: 96vh; }
        .stv-chat.h75 { height: 75vh; }
        .stv-chat.h50 { height: 50vh; }
        .stv-chat.h25 { height: 25vh; }
        .stv-chat.w30 { width: 30vw; }
        .stv-chat.w25 { width: 25vw; }
        .stv-chat.w20 { width: 20vw; }
        .stv-chat.w15 { width: 15vw; }
        .stv-chat.w10 { width: 10vw; }
        .stv-chat.size-s { font-size: 2.1vh; }
        .stv-chat.size-m { font-size: 2.7vh; }
        .stv-chat.size-l { font-size: 3.4vh; }

        .stv-msg {
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
            padding: 0.25em 0.45em;
            border-top: 1px solid rgba(255, 255, 255, 0.16);
            color: #ffffff;
            font-family: "Roboto", "LG Display", "SamsungOne", sans-serif;
            line-height: 1.35;
            word-wrap: break-word;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }
        .stv-msgs > .stv-msg:first-child {
            border-top: none;
        }
        .stv-nick { font-weight: bold; }
        .stv-emote { height: 1.35em; vertical-align: middle; margin: -0.15em 0; }
    </style>
    <script src="//msx.benzac.de/js/tvx-plugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
    <script src="js/twitch.js?v=1.5.8"></script>
    <script src="js/chat.js?v=1.5.8"></script>
    <script src="js/player.js?v=1.5.8"></script>
</head>

<body>
    <video id="player" playsinline="playsinline"></video>
</body>

</html>
